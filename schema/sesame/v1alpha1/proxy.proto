syntax = "proto3";

package sesame.v1alpha1;

import "google/api/field_behavior.proto";
import "sesame/type/netaddr.proto";

option go_package = "github.com/joeycumines/sesame/sesamepb";
option java_multiple_files = true;
option java_outer_classname = "ProxyProto";
option java_package = "io.github.joeycumines.sesame.v1alpha1";

// ProxyOptions specifies an ordered sequence of intermediate egress proxies.
message ProxyOptions {
  // Ordered sequence of proxy hops (Hop 1 -> Hop 2 -> ... -> Target).
  //
  // Each hop is a sequential server-side dial and handshake, so the count
  // is a server resource commitment: implementations SHOULD enforce a
  // maximum (the reference bound is 8) and MUST reject requests exceeding
  // their bound with INVALID_ARGUMENT.
  repeated ProxyHop hops = 1 [(google.api.field_behavior) = OPTIONAL];
}

// ProxyHop describes one intermediate proxy traversal.
message ProxyHop {
  // Traversal mechanism for this hop.
  //
  // Open enum: implementations MUST tolerate values they do not recognize
  // and MUST reject an unrecognized or TYPE_UNSPECIFIED hop with
  // INVALID_ARGUMENT.
  enum Type {
    // Default value. Invalid in a well-formed hop.
    TYPE_UNSPECIFIED = 0;

    // HTTP CONNECT tunneling, as in RFC 7231.
    TYPE_HTTP_CONNECT = 1;

    // SOCKS5 tunneling, as in RFC 1928.
    TYPE_SOCKS5 = 2;
  }

  // Traversal mechanism (REQUIRED).
  //
  // SOCKS5 note: each hop connects to the NEXT hop's address (or the
  // tunnel target for the last hop). RFC 1928 encodes a domain target
  // behind a u8 length field (ATYP 0x03), so a non-IP host longer than
  // 255 bytes cannot be encoded on the wire - implementations MUST
  // reject such a target with INVALID_ARGUMENT rather than truncating
  // the length.
  Type type = 1 [(google.api.field_behavior) = REQUIRED];

  // Address of the intermediate proxy server (REQUIRED).
  type.NetAddr address = 2 [(google.api.field_behavior) = REQUIRED];

  // Optional authentication username (e.g. SOCKS5 username, or the user
  // portion of HTTP CONNECT basic authentication).
  // Sensitive: implementations MUST NOT include this value in logs, errors,
  // or diagnostics.
  string username = 3 [(google.api.field_behavior) = OPTIONAL];

  // Optional authentication password (e.g. SOCKS5 password, or the password
  // portion of HTTP CONNECT basic authentication).
  // Sensitive: implementations MUST NOT include this value in logs, errors,
  // or diagnostics.
  string password = 4 [(google.api.field_behavior) = OPTIONAL];

  // Optional custom authorization header value sent verbatim as the
  // Proxy-Authorization header (e.g. "Basic ...", "Bearer ..."). Takes
  // precedence over username/password when set.
  // Sensitive: implementations MUST NOT include this value in logs, errors,
  // or diagnostics.
  // The value is interpolated verbatim into the raw proxy handshake
  // request, so it MUST NOT contain carriage return, line feed, or any
  // other control byte; implementations MUST reject such values with
  // INVALID_ARGUMENT. Hop addresses and the tunnel target follow the
  // same rule wherever they are interpolated into a handshake.
  string auth_header = 5 [(google.api.field_behavior) = OPTIONAL];
}

// ProxyResult confirms successful proxy negotiation.
message ProxyResult {
  // The sequence of successfully traversed proxy hops, as requested.
  // The Client MUST verify the hop count matches its request and abort on
  // a mismatch (fail closed).
  repeated type.NetAddr traversed_hops = 1;

  // Best-effort observation of the tunnel's egress point from the server's
  // perspective: the transport peer address of the connection to the first
  // hop (resolved, not as requested). This is NOT the externally observed
  // egress address as seen by the target; determining that requires
  // out-of-band cooperation. Clients MUST NOT rely on this field for
  // security decisions.
  type.NetAddr egress_address = 2;
}
