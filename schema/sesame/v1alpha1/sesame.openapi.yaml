openapi: 3.0.1
info:
  title: sesame/v1alpha1/sesame.proto
  contact:
    name: Sesame project
    url: https://github.com/joeycumines/sesame
  license:
    name: MIT License
    url: https://github.com/joeycumines/sesame/blob/main/LICENSE
  version: 0.1.0-alpha1
externalDocs:
  description: Source repository
  url: https://github.com/joeycumines/sesame
servers:
- url: /
tags:
- name: Sesame
  description: "Sesame is the core management and registration API, used to configure\
    \ and orchestrate access to remotes."
paths:
  /v1alpha1/{endpoint.name}:
    patch:
      tags:
      - Sesame
      summary: Updates an endpoint.
      operationId: Sesame_UpdateEndpoint
      parameters:
      - name: endpoint.name
        in: path
        description: |-
          The resource name of the endpoint.
          Format: namespaces/{namespace}/remotes/{remote}/endpoints/{endpoint}
        required: true
        schema:
          pattern: "namespaces/[^/]+/remotes/[^/]+/endpoints/[^/]+"
          type: string
      requestBody:
        description: |-
          The endpoint to update.

          The endpoint's `name` field is used to identify the endpoint to update.
          Format: namespaces/{namespace}/remotes/{remote}/endpoints/{endpoint}
        content:
          application/json:
            schema:
              title: The endpoint to update.
              type: object
              properties:
                displayName:
                  type: string
                  description: Human-readable name of the endpoint.
                description:
                  type: string
                  description: Description of the endpoint.
                createTime:
                  type: string
                  description: Creation timestamp of the endpoint.
                  format: date-time
                  readOnly: true
                spec:
                  $ref: '#/components/schemas/EndpointSpec'
              description: |-
                The endpoint's `name` field is used to identify the endpoint to update.
                Format: namespaces/{namespace}/remotes/{remote}/endpoints/{endpoint}
        required: true
      responses:
        "200":
          description: A successful response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/v1alpha1Endpoint'
        default:
          description: An unexpected error response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/rpcStatus'
      x-codegen-request-body-name: endpoint
  /v1alpha1/{name_1}:
    get:
      tags:
      - Sesame
      summary: Gets an endpoint by resource name.
      operationId: Sesame_GetEndpoint
      parameters:
      - name: name_1
        in: path
        description: |-
          The endpoint to retrieve, by resource name.
          Format: namespaces/{namespace}/remotes/{remote}/endpoints/{endpoint}
        required: true
        schema:
          pattern: "namespaces/[^/]+/remotes/[^/]+/endpoints/[^/]+"
          type: string
      responses:
        "200":
          description: A successful response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/v1alpha1Endpoint'
        default:
          description: An unexpected error response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/rpcStatus'
    delete:
      tags:
      - Sesame
      summary: Deletes an endpoint by resource name.
      operationId: Sesame_DeleteEndpoint
      parameters:
      - name: name_1
        in: path
        description: |-
          The endpoint to delete, by resource name.
          Format: namespaces/{namespace}/remotes/{remote}/endpoints/{endpoint}
        required: true
        schema:
          pattern: "namespaces/[^/]+/remotes/[^/]+/endpoints/[^/]+"
          type: string
      responses:
        "200":
          description: A successful response.
          content:
            application/json:
              schema:
                type: object
        default:
          description: An unexpected error response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/rpcStatus'
  /v1alpha1/{name}:
    get:
      tags:
      - Sesame
      summary: Gets a remote by resource name.
      operationId: Sesame_GetRemote
      parameters:
      - name: name
        in: path
        description: |-
          The remote to retrieve, by resource name.
          Format: namespaces/{namespace}/remotes/{remote}
        required: true
        schema:
          pattern: "namespaces/[^/]+/remotes/[^/]+"
          type: string
      responses:
        "200":
          description: A successful response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/v1alpha1Remote'
        default:
          description: An unexpected error response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/rpcStatus'
    delete:
      tags:
      - Sesame
      summary: Deletes a remote by resource name.
      operationId: Sesame_DeleteRemote
      parameters:
      - name: name
        in: path
        description: |-
          The remote to delete, by resource name.
          Format: namespaces/{namespace}/remotes/{remote}
        required: true
        schema:
          pattern: "namespaces/[^/]+/remotes/[^/]+"
          type: string
      - name: force
        in: query
        description: |-
          If set to true, any endpoints of the remote will also be deleted.
          (Otherwise, the request will only succeed if the remote has no
          endpoints.)
        schema:
          type: boolean
      responses:
        "200":
          description: A successful response.
          content:
            application/json:
              schema:
                type: object
        default:
          description: An unexpected error response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/rpcStatus'
  /v1alpha1/{parent}/endpoints:
    get:
      tags:
      - Sesame
      summary: Lists endpoints in the given remote.
      operationId: Sesame_ListEndpoints
      parameters:
      - name: parent
        in: path
        description: |-
          The remote to list endpoints in, by resource name.
          Format: namespaces/{namespace}/remotes/{remote}
        required: true
        schema:
          pattern: "namespaces/[^/]+/remotes/[^/]+"
          type: string
      - name: pageSize
        in: query
        description: |-
          The maximum number of endpoints to return. The service may return fewer
          than this value. If unspecified, at most 50 endpoints will be returned.
          The maximum value is 1000; values above 1000 will be coerced to 1000.
        schema:
          type: integer
          format: int32
      - name: pageToken
        in: query
        description: |-
          A page token, received from a previous ListEndpoints call.
          Provide this to retrieve the subsequent page.

          When paginating, all other parameters provided to ListEndpoints must
          match the call that provided the page token.
        schema:
          type: string
      responses:
        "200":
          description: A successful response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/v1alpha1ListEndpointsResponse'
        default:
          description: An unexpected error response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/rpcStatus'
    post:
      tags:
      - Sesame
      summary: Creates an endpoint in the given remote.
      operationId: Sesame_CreateEndpoint
      parameters:
      - name: parent
        in: path
        description: |-
          The remote to create the endpoint in, by resource name.
          Format: namespaces/{namespace}/remotes/{remote}
        required: true
        schema:
          pattern: "namespaces/[^/]+/remotes/[^/]+"
          type: string
      - name: endpointId
        in: query
        description: |-
          The ID to use for the endpoint, which will become the final component
          of the endpoint's resource name. A single path segment, without any "/".
          This value should be 4-63 characters, and valid characters are
          /[a-z][0-9]-/. May be omitted, in which case a server-assigned ID is
          used.
        schema:
          type: string
      requestBody:
        description: The endpoint to create. endpoint.name MUST NOT be set.
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/v1alpha1Endpoint'
        required: true
      responses:
        "200":
          description: A successful response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/v1alpha1Endpoint'
        default:
          description: An unexpected error response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/rpcStatus'
      x-codegen-request-body-name: endpoint
  /v1alpha1/{parent}/remotes:
    get:
      tags:
      - Sesame
      summary: Lists remotes in the given namespace.
      operationId: Sesame_ListRemotes
      parameters:
      - name: parent
        in: path
        description: |-
          The namespace to list remotes in, by resource name.
          Format: namespaces/{namespace}
        required: true
        schema:
          pattern: "namespaces/[^/]+"
          type: string
      - name: pageSize
        in: query
        description: |-
          The maximum number of remotes to return. The service may return fewer
          than this value. If unspecified, at most 50 remotes will be returned.
          The maximum value is 1000; values above 1000 will be coerced to 1000.
        schema:
          type: integer
          format: int32
      - name: pageToken
        in: query
        description: |-
          A page token, received from a previous ListRemotes call.
          Provide this to retrieve the subsequent page.

          When paginating, all other parameters provided to ListRemotes must match
          the call that provided the page token.
        schema:
          type: string
      responses:
        "200":
          description: A successful response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/v1alpha1ListRemotesResponse'
        default:
          description: An unexpected error response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/rpcStatus'
    post:
      tags:
      - Sesame
      summary: Creates a remote in the given namespace.
      operationId: Sesame_CreateRemote
      parameters:
      - name: parent
        in: path
        description: |-
          The namespace to create the remote in, by resource name.
          Format: namespaces/{namespace}
        required: true
        schema:
          pattern: "namespaces/[^/]+"
          type: string
      - name: remoteId
        in: query
        description: |-
          The ID to use for the remote, which will become the final component of
          the remote's resource name. A single path segment, without any "/".
          This value should be 4-63 characters, and valid characters are
          /[a-z][0-9]-/. May be omitted, in which case a server-assigned ID is
          used.
        schema:
          type: string
      requestBody:
        description: The remote to create. remote.name MUST NOT be set.
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/v1alpha1Remote'
        required: true
      responses:
        "200":
          description: A successful response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/v1alpha1Remote'
        default:
          description: An unexpected error response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/rpcStatus'
      x-codegen-request-body-name: remote
  /v1alpha1/{remote.name}:
    patch:
      tags:
      - Sesame
      summary: Updates a remote.
      operationId: Sesame_UpdateRemote
      parameters:
      - name: remote.name
        in: path
        description: |-
          The resource name of the remote.
          Format: namespaces/{namespace}/remotes/{remote}
        required: true
        schema:
          pattern: "namespaces/[^/]+/remotes/[^/]+"
          type: string
      requestBody:
        description: |-
          The remote to update.

          The remote's `name` field is used to identify the remote to update.
          Format: namespaces/{namespace}/remotes/{remote}
        content:
          application/json:
            schema:
              title: The remote to update.
              type: object
              properties:
                displayName:
                  type: string
                  description: Human-readable name of the remote.
                description:
                  type: string
                  description: Description of the remote.
                createTime:
                  type: string
                  description: Creation timestamp of the remote.
                  format: date-time
                  readOnly: true
              description: |-
                The remote's `name` field is used to identify the remote to update.
                Format: namespaces/{namespace}/remotes/{remote}
        required: true
      responses:
        "200":
          description: A successful response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/v1alpha1Remote'
        default:
          description: An unexpected error response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/rpcStatus'
      x-codegen-request-body-name: remote
components:
  schemas:
    EndpointSpec:
      type: object
      properties:
        tunnel:
          $ref: '#/components/schemas/EndpointTunnel'
      description: "Spec models the endpoint specification, containing configuration\
        \ around access and usage behavior."
    EndpointTunnel:
      title: |-
        Tunnel models an endpoint exposed directly over a tunnel provider.
        TODO might eventually make this configurable (more than one tunnel pattern)
      type: object
    protobufAny:
      type: object
      properties:
        '@type':
          type: string
          description: |-
            Identifies the type of the serialized Protobuf message with a URI reference
            consisting of a prefix ending in a slash and the fully-qualified type name.

            Example: type.googleapis.com/google.protobuf.StringValue

            This string must contain at least one `/` character, and the content after
            the last `/` must be the fully-qualified name of the type in canonical
            form, without a leading dot. Do not write a scheme on these URI references
            so that clients do not attempt to contact them.

            The prefix is arbitrary and Protobuf implementations are expected to
            simply strip off everything up to and including the last `/` to identify
            the type. `type.googleapis.com/` is a common default prefix that some
            legacy implementations require. This prefix does not indicate the origin of
            the type, and URIs containing it are not expected to respond to any
            requests.

            All type URL strings must be legal URI references with the additional
            restriction (for the text format) that the content of the reference
            must consist only of alphanumeric characters, percent-encoded escapes, and
            characters in the following set (not including the outer backticks):
            `/-.~_!$&()*+,;=`. Despite our allowing percent encodings, implementations
            should not unescape them to prevent confusion with existing parsers. For
            example, `type.googleapis.com%2FFoo` should be rejected.

            In the original design of `Any`, the possibility of launching a type
            resolution service at these type URLs was considered but Protobuf never
            implemented one and considers contacting these URLs to be problematic and
            a potential security issue. Do not attempt to contact type URLs.
      additionalProperties: true
      description: |-
        `Any` contains an arbitrary serialized protocol buffer message along with a
        URL that describes the type of the serialized message.

        In its binary encoding, an `Any` is an ordinary message; but in other wire
        forms like JSON, it has a special encoding. The format of the type URL is
        described on the `type_url` field.

        Protobuf APIs provide utilities to interact with `Any` values:

        - A 'pack' operation accepts a message and constructs a generic `Any` wrapper
          around it.
        - An 'unpack' operation reads the content of an `Any` message, either into an
          existing message or a new one. Unpack operations must check the type of the
          value they unpack against the declared `type_url`.
        - An 'is' operation decides whether an `Any` contains a message of the given
          type, i.e. whether it can 'unpack' that type.

        The JSON format representation of an `Any` follows one of these cases:

        - For types without special-cased JSON encodings, the JSON format
          representation of the `Any` is the same as that of the message, with an
          additional `@type` field which contains the type URL.
        - For types with special-cased JSON encodings (typically called 'well-known'
          types, listed in https://protobuf.dev/programming-guides/json/#any), the
          JSON format representation has a key `@type` which contains the type URL
          and a key `value` which contains the JSON-serialized value.

        The text format representation of an `Any` is like a message with one field
        whose name is the type URL in brackets. For example, an `Any` containing a
        `foo.Bar` message may be written `[type.googleapis.com/foo.Bar] { a: 2 }`.
    rpcStatus:
      type: object
      properties:
        code:
          type: integer
          description: |-
            The status code, which should be an enum value of
            [google.rpc.Code][google.rpc.Code].
          format: int32
        message:
          type: string
          description: |-
            A developer-facing error message, which should be in English. Any
            user-facing error message should be localized and sent in the
            [google.rpc.Status.details][google.rpc.Status.details] field, or localized
            by the client.
        details:
          type: array
          description: |-
            A list of messages that carry the error details.  There is a common set of
            message types for APIs to use.
          items:
            $ref: '#/components/schemas/protobufAny'
      description: |-
        The `Status` type defines a logical error model that is suitable for
        different programming environments, including REST APIs and RPC APIs. It is
        used by [gRPC](https://github.com/grpc). Each `Status` message contains
        three pieces of data: error code, error message, and error details.

        You can find out more about this error model and how to work with it in the
        [API Design Guide](https://cloud.google.com/apis/design/errors).
    v1alpha1Endpoint:
      type: object
      properties:
        name:
          title: |-
            The resource name of the endpoint.
            Format: namespaces/{namespace}/remotes/{remote}/endpoints/{endpoint}
          type: string
        displayName:
          type: string
          description: Human-readable name of the endpoint.
        description:
          type: string
          description: Description of the endpoint.
        createTime:
          type: string
          description: Creation timestamp of the endpoint.
          format: date-time
          readOnly: true
        spec:
          $ref: '#/components/schemas/EndpointSpec'
      description: Endpoint is a gRPC service available via a remote.
    v1alpha1ListEndpointsResponse:
      type: object
      properties:
        endpoints:
          type: array
          description: The endpoints from the specified remote.
          items:
            $ref: '#/components/schemas/v1alpha1Endpoint'
        nextPageToken:
          type: string
          description: |-
            A token, which can be sent as page_token to retrieve the next page.
            If this field is omitted, there are no subsequent pages.
      description: ListEndpointsResponse models a Sesame.ListEndpoints response.
    v1alpha1ListRemotesResponse:
      type: object
      properties:
        remotes:
          type: array
          description: The remotes from the specified namespace.
          items:
            $ref: '#/components/schemas/v1alpha1Remote'
        nextPageToken:
          type: string
          description: |-
            A token, which can be sent as page_token to retrieve the next page.
            If this field is omitted, there are no subsequent pages.
      description: ListRemotesResponse models a Sesame.ListRemotes response.
    v1alpha1Remote:
      type: object
      properties:
        name:
          title: |-
            The resource name of the remote.
            Format: namespaces/{namespace}/remotes/{remote}
          type: string
        displayName:
          type: string
          description: Human-readable name of the remote.
        description:
          type: string
          description: Description of the remote.
        createTime:
          type: string
          description: Creation timestamp of the remote.
          format: date-time
          readOnly: true
      description: Remote is a network device or other resource that may be accessed
        by Sesame clients.
