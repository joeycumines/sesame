syntax = "proto3";

package sesame.type;

option go_package = "github.com/joeycumines/sesame/typepb";
option java_multiple_files = true;
option java_outer_classname = "NetaddrProto";
option java_package = "io.github.joeycumines.sesame.type";

// NetAddr represents a network end point address.
//
// The two fields network and address are conventionally strings that can be passed as the arguments to Go's net.Dial,
// but the exact form and meaning of the strings is up to the implementation.
//
// See also Go's net.Addr interface.
message NetAddr {
  // The network the address belongs to, e.g. "tcp" or "udp".
  string network = 1;

  // The address itself, in a network-specific form, e.g. "host:port".
  string address = 2;
}
